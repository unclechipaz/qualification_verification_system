[tool.ruff]
target-version = "py312"
src = ["backend"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["backend"]
relative_files = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80
