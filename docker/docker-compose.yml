services:
  db:
    image: postgres:16-alpine
    container_name: msu_qvs_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=msu_qvs_db
      - POSTGRES_USER=msu_user
      - POSTGRES_PASSWORD=msu_password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: msu_qvs_web
    # Development bind mounts use host files; production runs as qvs.
    user: "0:0"
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=msu_qvs.settings
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=msu_qvs_db
      - DB_USER=msu_user
      - DB_PASSWORD=msu_password
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
